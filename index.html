<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 10;
        }
        .sticky-col-header {
            position: sticky;
            left: 0;
            z-index: 20;
        }
        /* State badge styles inside table */
        .status-btn {
            transition: all 0.15s ease-in-out;
        }
        .status-btn:active {
            transform: scale(0.92);
        }

        /* Drag & Drop Styles */
        .draggable-th {
            cursor: grab;
            user-select: none;
        }
        .draggable-th:active {
            cursor: grabbing;
        }
        .dragging {
            opacity: 0.4;
            background-color: #e0e7ff !important;
        }
        .drag-over-left {
            border-left: 3px solid #4f46e5 !important;
        }
        .drag-over-right {
            border-right: 3px solid #4f46e5 !important;
        }

        /* Modal Draggable List Styles */
        .modal-item-row {
            cursor: grab;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .modal-item-row:active {
            cursor: grabbing;
        }
        .modal-item-row.dragging {
            opacity: 0.5;
            border-style: dashed;
            border-color: #6366f1;
        }
        .modal-item-row.drag-over {
            border-top: 2px solid #4f46e5;
        }

        /* Building Row Drag & Drop Styles */
        .draggable-row {
            cursor: grab;
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }
        .draggable-row:active {
            cursor: grabbing;
        }
        .draggable-row.row-dragging {
            opacity: 0.45;
            background-color: #e0e7ff !important;
        }
        .row-drag-over-top {
            border-top: 3px solid #4f46e5 !important;
        }
        .row-drag-over-bottom {
            border-bottom: 3px solid #4f46e5 !important;
        }
    </style>
</head>

    <!-- Firebase Script Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'building-chk-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

        let app, auth, db;
        let unsubscribeRoom = null;
        let isRemoteUpdating = false;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            // Auth
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        } catch (e) {
            console.warn("Cloud sync disabled or running locally without firebase config", e);
        }

        // Global Firebase functions attached to window for classical JS access
        window.cloudSync = {
            activeRoomId: null,

            async saveToCloud() {
                if (!db || !this.activeRoomId || isRemoteUpdating) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklists', this.activeRoomId);
                    await setDoc(docRef, {
                        items: window.items,
                        buildings: window.buildings,
                        updatedAt: new Date().toISOString()
                    });
                } catch (err) {
                    console.error("Cloud save failed:", err);
                }
            },

            subscribeToRoom(roomId) {
                if (!db) return;
                if (unsubscribeRoom) unsubscribeRoom();

                this.activeRoomId = roomId;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklists', roomId);

                unsubscribeRoom = onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        isRemoteUpdating = true;
                        if (data.items) window.items = data.items;
                        if (data.buildings) window.buildings = data.buildings;
                        
                        window.saveLocalOnly();
                        window.renderHeader();
                        window.renderBody();
                        window.updateDashboard();
                        isRemoteUpdating = false;
                    }
                }, (error) => {
                    console.error("Cloud listener error:", error);
                });

                // Update UI Status
                document.getElementById('syncStatusBar').classList.remove('hidden');
                document.getElementById('currentRoomIdDisplay').textContent = roomId;
            }
        };

        // Check URL parameter for roomId on page load
        const urlParams = new URLSearchParams(window.location.search);
        const urlRoomId = urlParams.get('room');
        if (urlRoomId) {
            window.cloudSync.subscribeToRoom(urlRoomId);
        }
    </script>

    <script>
        // Status definitions: 'CHECKED' (완료/O), 'NA' (해당없음), 'UNCHECKED' (미완료/X)
        const STATUS = {
            UNCHECKED: 'UNCHECKED',
            CHECKED: 'CHECKED',
            NA: 'NA'
        };

        const DEFAULT_ITEMS = [
            "소방설비", "전기안전", "승강기점검", "가스설비", "보일러/음용수",
            "옥상방수", "외벽균열", "주차장장비", "CCTV작동", "조명기구",
            "비상발전기", "배수펌프", "환기시설", "소화기배치", "피난계단",
            "자동문작동", "위생방역", "경비보안", "폐기물수거", "에어컨청소"
        ];

        // Default building list set to empty
        const DEFAULT_BUILDINGS = [];

        // State Management
        window.items = JSON.parse(localStorage.getItem('chk_items_v2')) || DEFAULT_ITEMS;
        window.buildings = JSON.parse(localStorage.getItem('chk_buildings_v2')) || DEFAULT_BUILDINGS;

        // Drag & Drop State Tracking
        let draggedItemIndex = null;
        let draggedBuildingIndex = null;
        let modalDraggedIndex = null;

        // DOM Elements
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const addBuildingForm = document.getElementById('addBuildingForm');
        const newBuildingInput = document.getElementById('newBuildingInput');
        const searchInput = document.getElementById('searchInput');
        const totalBuildingsCount = document.getElementById('totalBuildingsCount');
        const totalItemsCount = document.getElementById('totalItemsCount');
        const overallProgressText = document.getElementById('overallProgressText');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const resetDataBtn = document.getElementById('resetDataBtn');

        // Modal DOM Elements
        const columnModal = document.getElementById('columnModal');
        const manageColumnsBtn = document.getElementById('manageColumnsBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const saveModalBtn = document.getElementById('saveModalBtn');
        const modalItemsList = document.getElementById('modalItemsList');
        const modalItemCount = document.getElementById('modalItemCount');
        const addNewItemBtn = document.getElementById('addNewItemBtn');

        // Cloud Share Modal Elements
        const shareSyncBtn = document.getElementById('shareSyncBtn');
        const shareModal = document.getElementById('shareModal');
        const closeShareModalBtn = document.getElementById('closeShareModalBtn');
        const createNewCloudRoomBtn = document.getElementById('createNewCloudRoomBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const joinRoomCodeInput = document.getElementById('joinRoomCodeInput');
        const copyShareLinkBtn = document.getElementById('copyShareLinkBtn');

        window.saveLocalOnly = function() {
            localStorage.setItem('chk_items_v2', JSON.stringify(window.items));
            localStorage.setItem('chk_buildings_v2', JSON.stringify(window.buildings));
        }

        function saveData() {
            window.saveLocalOnly();
            updateDashboard();
            if (window.cloudSync && window.cloudSync.activeRoomId) {
                window.cloudSync.saveToCloud();
            }
        }

        // Reorder item data and adjust all building check records accordingly
        function reorderItems(fromIdx, toIdx) {
            if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= window.items.length || toIdx >= window.items.length) return;

            // 1. Reorder items array
            const [movedItem] = window.items.splice(fromIdx, 1);
            window.items.splice(toIdx, 0, movedItem);

            // 2. Remap building check statuses for each building to match new item index mapping
            window.buildings.forEach(building => {
                if (!building.checks) return;

                const newChecks = {};
                // Helper mapping function: oldIndex -> newIndex
                const getNewIndex = (oldIdx) => {
                    if (oldIdx === fromIdx) return toIdx;
                    if (fromIdx < toIdx && oldIdx > fromIdx && oldIdx <= toIdx) return oldIdx - 1;
                    if (fromIdx > toIdx && oldIdx >= toIdx && oldIdx < fromIdx) return oldIdx + 1;
                    return oldIdx;
                };

                Object.keys(building.checks).forEach(oldKeyStr => {
                    const oldKey = parseInt(oldKeyStr, 10);
                    const status = building.checks[oldKey];
                    const newKey = getNewIndex(oldKey);
                    newChecks[newKey] = status;
                });

                building.checks = newChecks;
            });

            saveData();
            window.renderHeader();
            window.renderBody();
        }

        // Reorder building rows array
        function reorderBuildings(fromIdx, toIdx) {
            if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= window.buildings.length || toIdx >= window.buildings.length) return;

            const [movedBuilding] = window.buildings.splice(fromIdx, 1);
            window.buildings.splice(toIdx, 0, movedBuilding);

            saveData();
            window.renderBody();
        }

        window.renderHeader = function() {
            let html = `
                <th scope="col" class="py-3.5 px-4 sticky-col-header bg-slate-100 min-w-[180px] max-w-[220px] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                    건물명
                </th>
                <th scope="col" class="py-3.5 px-3 min-w-[100px] text-center">진행률</th>
            `;

            window.items.forEach((item, index) => {
                html += `
                    <th scope="col" 
                        draggable="true" 
                        data-index="${index}"
                        class="draggable-th py-3.5 px-3 min-w-[110px] text-center group transition-colors duration-150 border-r border-slate-200/50 last:border-r-0 hover:bg-slate-200/60"
                        title="드래그하여 순서 변경 (클릭시 항목 수정 가능)">
                        <div class="flex items-center justify-center gap-1.5 text-slate-700 group-hover:text-indigo-600 transition">
                            <i class="fa-solid fa-grip-vertical text-[10px] text-slate-300 group-hover:text-indigo-400"></i>
                            <span class="font-medium truncate max-w-[85px]">${item}</span>
                            <button onclick="openModal()" class="text-slate-400 hover:text-indigo-600 opacity-0 group-hover:opacity-100 transition p-0.5">
                                <i class="fa-solid fa-pen text-[10px]"></i>
                            </button>
                        </div>
                    </th>
                `;
            });

            html += `<th scope="col" class="py-3.5 px-3 min-w-[80px] text-center sticky right-0 bg-slate-100">관리</th>`;
            tableHeader.innerHTML = html;

            attachHeaderDragListeners();
        }

        function attachHeaderDragListeners() {
            const draggables = tableHeader.querySelectorAll('.draggable-th');

            draggables.forEach(th => {
                th.addEventListener('dragstart', (e) => {
                    draggedItemIndex = parseInt(th.getAttribute('data-index'), 10);
                    th.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedItemIndex);
                });

                th.addEventListener('dragend', () => {
                    th.classList.remove('dragging');
                    draggables.forEach(item => {
                        item.classList.remove('drag-over-left', 'drag-over-right');
                    });
                    draggedItemIndex = null;
                });

                th.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedItemIndex === null) return;
                    
                    const targetIndex = parseInt(th.getAttribute('data-index'), 10);
                    if (draggedItemIndex === targetIndex) return;

                    draggables.forEach(item => item.classList.remove('drag-over-left', 'drag-over-right'));
                    
                    if (draggedItemIndex < targetIndex) {
                        th.classList.add('drag-over-right');
                    } else {
                        th.classList.add('drag-over-left');
                    }
                });

                th.addEventListener('dragleave', () => {
                    th.classList.remove('drag-over-left', 'drag-over-right');
                });

                th.addEventListener('drop', (e) => {
                    e.preventDefault();
                    th.classList.remove('drag-over-left', 'drag-over-right');
                    const targetIndex = parseInt(th.getAttribute('data-index'), 10);

                    if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
                        reorderItems(draggedItemIndex, targetIndex);
                    }
                });
            });
        }

        function calculateBuildingProgress(building) {
            let validTotal = 0;
            let checkedCount = 0;

            window.items.forEach((_, idx) => {
                const status = building.checks ? building.checks[idx] : STATUS.UNCHECKED;
                if (status === STATUS.CHECKED) {
                    checkedCount++;
                    validTotal++;
                } else if (status !== STATUS.NA) {
                    validTotal++;
                }
            });

            const percentage = validTotal > 0 ? Math.round((checkedCount / validTotal) * 100) : 100;
            return { percentage, checkedCount, validTotal };
        }

        window.renderBody = function() {
            const query = searchInput.value.trim().toLowerCase();
            const filteredBuildings = window.buildings.filter(b => b.name.toLowerCase().includes(query));

            if (filteredBuildings.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="${window.items.length + 3}" class="py-12 text-center text-slate-400">
                            <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>
                            등록된 건물 데이터가 없거나 검색 결과가 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';

            filteredBuildings.forEach((building, bIdx) => {
                const { percentage } = calculateBuildingProgress(building);
                
                let badgeColor = 'bg-slate-100 text-slate-600';
                if (percentage === 100) badgeColor = 'bg-emerald-100 text-emerald-700 font-semibold';
                else if (percentage > 50) badgeColor = 'bg-indigo-100 text-indigo-700';

                html += `
                    <tr draggable="true" data-building-index="${bIdx}" class="draggable-row hover:bg-indigo-50/30 transition group">
                        <!-- Sticky Building Name Column -->
                        <td class="py-3 px-4 font-medium text-slate-800 sticky-col bg-white group-hover:bg-slate-50/90 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.08)] flex items-center justify-between gap-2 min-w-[180px]">
                            <div class="flex items-center gap-2 truncate">
                                <i class="fa-solid fa-grip-vertical text-slate-300 group-hover:text-indigo-400 cursor-grab text-xs"></i>
                                <span class="truncate" id="name-display-${building.id}">${building.name}</span>
                            </div>
                            <button onclick="editBuildingName('${building.id}')" class="text-slate-400 hover:text-indigo-600 opacity-0 group-hover:opacity-100 transition p-1" title="건물명 수정">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                        </td>

                        <!-- Progress Cell -->
                        <td class="py-3 px-3 text-center">
                            <div class="flex flex-col items-center gap-1">
                                <span class="text-xs px-2 py-0.5 rounded-full ${badgeColor}">${percentage}%</span>
                                <div class="w-16 bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                    <div class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: ${percentage}%"></div>
                                </div>
                            </div>
                        </td>
                `;

                // Render State Buttons (O / N/A / X)
                window.items.forEach((_, idx) => {
                    const status = (building.checks && building.checks[idx]) ? building.checks[idx] : STATUS.UNCHECKED;
                    
                    let buttonHtml = '';
                    if (status === STATUS.CHECKED) {
                        buttonHtml = `
                            <button onclick="cycleStatus('${building.id}', ${idx})" 
                                class="status-btn w-8 h-8 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs shadow-sm flex items-center justify-center mx-auto"
                                title="상태: 완료 (클릭 시 해당없음으로 변경)">
                                <i class="fa-solid fa-check"></i>
                            </button>
                        `;
                    } else if (status === STATUS.NA) {
                        buttonHtml = `
                            <button onclick="cycleStatus('${building.id}', ${idx})" 
                                class="status-btn w-8 h-8 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold text-xs flex items-center justify-center mx-auto border border-amber-300"
                                title="상태: 해당없음 (클릭 시 미점검으로 변경)">
                                <span class="text-[10px]">N/A</span>
                            </button>
                        `;
                    } else {
                        // UNCHECKED
                        buttonHtml = `
                            <button onclick="cycleStatus('${building.id}', ${idx})" 
                                class="status-btn w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-300 hover:text-slate-500 text-xs flex items-center justify-center mx-auto border border-slate-200"
                                title="상태: 미점검 (클릭 시 완료로 변경)">
                                <i class="fa-solid fa-minus text-[10px]"></i>
                            </button>
                        `;
                    }

                    html += `<td class="py-3 px-3 text-center">${buttonHtml}</td>`;
                });

                // Action Buttons Cell
                html += `
                        <td class="py-3 px-3 text-center sticky right-0 bg-white group-hover:bg-slate-50/90">
                            <button onclick="deleteBuilding('${building.id}')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="건물 삭제">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
            attachRowDragListeners();
        }

        function attachRowDragListeners() {
            const isSearching = searchInput.value.trim().length > 0;
            const rows = tableBody.querySelectorAll('.draggable-row');

            rows.forEach(row => {
                if (isSearching) {
                    row.removeAttribute('draggable');
                    return;
                }

                row.addEventListener('dragstart', (e) => {
                    draggedBuildingIndex = parseInt(row.getAttribute('data-building-index'), 10);
                    row.classList.add('row-dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedBuildingIndex);
                });

                row.addEventListener('dragend', () => {
                    row.classList.remove('row-dragging');
                    rows.forEach(r => r.classList.remove('row-drag-over-top', 'row-drag-over-bottom'));
                    draggedBuildingIndex = null;
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedBuildingIndex === null) return;

                    const targetIndex = parseInt(row.getAttribute('data-building-index'), 10);
                    if (draggedBuildingIndex === targetIndex) return;

                    rows.forEach(r => r.classList.remove('row-drag-over-top', 'row-drag-over-bottom'));

                    if (draggedBuildingIndex < targetIndex) {
                        row.classList.add('row-drag-over-bottom');
                    } else {
                        row.classList.add('row-drag-over-top');
                    }
                });

                row.addEventListener('dragleave', () => {
                    row.classList.remove('row-drag-over-top', 'row-drag-over-bottom');
                });

                row.addEventListener('drop', (e) => {
                    e.preventDefault();
                    row.classList.remove('row-drag-over-top', 'row-drag-over-bottom');
                    const targetIndex = parseInt(row.getAttribute('data-building-index'), 10);

                    if (draggedBuildingIndex !== null && draggedBuildingIndex !== targetIndex) {
                        reorderBuildings(draggedBuildingIndex, targetIndex);
                    }
                });
            });
        }

        window.cycleStatus = function(buildingId, itemIndex) {
            const building = window.buildings.find(b => b.id === buildingId);
            if (building) {
                if (!building.checks) building.checks = {};
                
                const current = building.checks[itemIndex] || STATUS.UNCHECKED;
                if (current === STATUS.UNCHECKED) {
                    building.checks[itemIndex] = STATUS.CHECKED;
                } else if (current === STATUS.CHECKED) {
                    building.checks[itemIndex] = STATUS.NA;
                } else {
                    building.checks[itemIndex] = STATUS.UNCHECKED;
                }

                saveData();
                window.renderBody();
            }
        };

        // Add New Building
        addBuildingForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = newBuildingInput.value.trim();
            if (!name) return;

            const newBuilding = {
                id: 'b_' + Date.now(),
                name: name,
                checks: {}
            };

            window.buildings.push(newBuilding);
            newBuildingInput.value = '';
            saveData();
            window.renderBody();
        });

        // Edit Building Name
        window.editBuildingName = function(buildingId) {
            const building = window.buildings.find(b => b.id === buildingId);
            if (!building) return;

            const newName = prompt('수정할 건물명을 입력하세요:', building.name);
            if (newName && newName.trim() !== '') {
                building.name = newName.trim();
                saveData();
                window.renderBody();
            }
        };

        // Delete Building
        window.deleteBuilding = function(buildingId) {
            if (confirm('이 건물을 목록에서 삭제하시겠습니까?')) {
                window.buildings = window.buildings.filter(b => b.id !== buildingId);
                saveData();
                window.renderBody();
            }
        };

        window.updateDashboard = function() {
            totalBuildingsCount.textContent = window.buildings.length;
            totalItemsCount.textContent = window.items.length;

            if (window.buildings.length === 0 || window.items.length === 0) {
                overallProgressText.textContent = '0%';
                return;
            }

            let grandTotalValid = 0;
            let grandTotalChecked = 0;

            window.buildings.forEach(b => {
                const { checkedCount, validTotal } = calculateBuildingProgress(b);
                grandTotalChecked += checkedCount;
                grandTotalValid += validTotal;
            });

            const overallPct = grandTotalValid > 0 ? Math.round((grandTotalChecked / grandTotalValid) * 100) : 0;
            overallProgressText.textContent = `${overallPct}%`;
        }

        window.openModal = function() {
            renderModalInputs();
            columnModal.classList.remove('hidden');
            setTimeout(() => {
                columnModal.classList.remove('opacity-0');
                columnModal.children[0].classList.remove('scale-95');
            }, 10);
        };

        function closeModal() {
            columnModal.classList.add('opacity-0');
            columnModal.children[0].classList.add('scale-95');
            setTimeout(() => {
                columnModal.classList.add('hidden');
            }, 200);
        }

        manageColumnsBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        function renderModalInputs() {
            modalItemCount.textContent = window.items.length;
            modalItemsList.innerHTML = '';

            window.items.forEach((item, idx) => {
                const itemRow = document.createElement('div');
                itemRow.className = 'modal-item-row flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200';
                itemRow.setAttribute('draggable', 'true');
                itemRow.setAttribute('data-index', idx);
                itemRow.innerHTML = `
                    <div class="cursor-grab text-slate-300 hover:text-slate-500 px-1">
                        <i class="fa-solid fa-grip-vertical"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-400 w-5 text-center">${idx + 1}</span>
                    <input type="text" value="${item}" data-index="${idx}" class="modal-item-input flex-1 px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="removeModalItem(${idx})" class="text-slate-400 hover:text-rose-500 px-2 py-1 transition" title="항목 삭제">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                modalItemsList.appendChild(itemRow);
            });

            attachModalDragListeners();
        }

        function syncModalInputsToItems() {
            const inputs = document.querySelectorAll('.modal-item-input');
            return Array.from(inputs).map(i => i.value);
        }

        function attachModalDragListeners() {
            const rows = modalItemsList.querySelectorAll('.modal-item-row');

            rows.forEach(row => {
                row.addEventListener('dragstart', (e) => {
                    // Sync current input text values before dragging
                    window.items = syncModalInputsToItems();
                    modalDraggedIndex = parseInt(row.getAttribute('data-index'), 10);
                    row.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                row.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    rows.forEach(r => r.classList.remove('drag-over'));
                    modalDraggedIndex = null;
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (modalDraggedIndex === null) return;
                    const targetIndex = parseInt(row.getAttribute('data-index'), 10);
                    if (modalDraggedIndex === targetIndex) return;

                    rows.forEach(r => r.classList.remove('drag-over'));
                    row.classList.add('drag-over');
                });

                row.addEventListener('dragleave', () => {
                    row.classList.remove('drag-over');
                });

                row.addEventListener('drop', (e) => {
                    e.preventDefault();
                    row.classList.remove('drag-over');
                    const targetIndex = parseInt(row.getAttribute('data-index'), 10);

                    if (modalDraggedIndex !== null && modalDraggedIndex !== targetIndex) {
                        // Reorder items in current modal session
                        const currentValues = syncModalInputsToItems();
                        const [moved] = currentValues.splice(modalDraggedIndex, 1);
                        currentValues.splice(targetIndex, 0, moved);
                        window.items = currentValues;
                        renderModalInputs();
                    }
                });
            });
        }

        window.removeModalItem = function(index) {
            const currentValues = syncModalInputsToItems();
            currentValues.splice(index, 1);

            window.items = currentValues;
            renderModalInputs();
        };

        addNewItemBtn.addEventListener('click', () => {
            const currentValues = syncModalInputsToItems();
            currentValues.push(`새 항목 ${currentValues.length + 1}`);
            window.items = currentValues;
            renderModalInputs();
            
            setTimeout(() => {
                modalItemsList.scrollTop = modalItemsList.scrollHeight;
            }, 50);
        });

        saveModalBtn.addEventListener('click', () => {
            const inputs = document.querySelectorAll('.modal-item-input');
            const newItems = Array.from(inputs).map(i => i.value.trim()).filter(v => v !== '');

            if (newItems.length === 0) {
                alert('최소 하나 이상의 체크 항목이 필요합니다.');
                return;
            }

            window.items = newItems;
            saveData();
            window.renderHeader();
            window.renderBody();
            closeModal();
        });

        exportCsvBtn.addEventListener('click', () => {
            if (window.buildings.length === 0) {
                alert('내보낼 건물 데이터가 없습니다.');
                return;
            }

            let csvContent = "\uFEFF";
            
            const headers = ["건물명", "진행률(%)", ...window.items];
            csvContent += headers.map(h => `"${h.replace(/"/g, '""')}"`).join(",") + "\n";

            window.buildings.forEach(b => {
                const { percentage } = calculateBuildingProgress(b);

                const row = [
                    `"${b.name.replace(/"/g, '""')}"`,
                    `"${percentage}%"`
                ];

                window.items.forEach((_, idx) => {
                    const status = b.checks ? b.checks[idx] : STATUS.UNCHECKED;
                    let displayVal = "X";
                    if (status === STATUS.CHECKED) displayVal = "O";
                    else if (status === STATUS.NA) displayVal = "N/A";
                    row.push(`"${displayVal}"`);
                });

                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `건물_체크리스트_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Reset Data Functionality
        resetDataBtn.addEventListener('click', () => {
            if (confirm('모든 데이터를 초기 기본값으로 리셋하시겠습니까? 데이터가 초기화됩니다.')) {
                localStorage.removeItem('chk_items_v2');
                localStorage.removeItem('chk_buildings_v2');
                window.items = [...DEFAULT_ITEMS];
                window.buildings = JSON.parse(JSON.stringify(DEFAULT_BUILDINGS));
                saveData();
                window.renderHeader();
                window.renderBody();
            }
        });

        // Cloud Share Handlers
        shareSyncBtn.addEventListener('click', () => {
            shareModal.classList.remove('hidden');
            setTimeout(() => {
                shareModal.classList.remove('opacity-0');
                shareModal.children[0].classList.remove('scale-95');
            }, 10);
        });

        function closeShareModal() {
            shareModal.classList.add('opacity-0');
            shareModal.children[0].classList.add('scale-95');
            setTimeout(() => {
                shareModal.classList.add('hidden');
            }, 200);
        }

        closeShareModalBtn.addEventListener('click', closeShareModal);

        createNewCloudRoomBtn.addEventListener('click', () => {
            const newRoomId = 'bld_' + Math.random().toString(36).substring(2, 8);
            if (window.cloudSync) {
                window.cloudSync.subscribeToRoom(newRoomId);
                window.cloudSync.saveToCloud();
                
                // Append parameter to URL without page refresh
                const newUrl = window.location.pathname + '?room=' + newRoomId;
                window.history.pushState({ path: newUrl }, '', newUrl);

                closeShareModal();
            }
        });

        joinRoomBtn.addEventListener('click', () => {
            const roomId = joinRoomCodeInput.value.trim();
            if (!roomId) return;

            if (window.cloudSync) {
                window.cloudSync.subscribeToRoom(roomId);
                const newUrl = window.location.pathname + '?room=' + roomId;
                window.history.pushState({ path: newUrl }, '', newUrl);

                closeShareModal();
            }
        });

        copyShareLinkBtn.addEventListener('click', () => {
            const shareUrl = window.location.href;
            const tempInput = document.createElement('input');
            document.body.appendChild(tempInput);
            tempInput.value = shareUrl;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            alert('공유 링크가 클립보드에 복사되었습니다!\n다른 창이나 모바일에서 이 링크로 접속하시면 실시간으로 동기화됩니다.');
        });

        // Search Filter Binding
        searchInput.addEventListener('input', window.renderBody);

        // App Initialization
        window.onload = function() {
            window.renderHeader();
            window.renderBody();
            window.updateDashboard();
        };
    </script>
</body>
</html>
